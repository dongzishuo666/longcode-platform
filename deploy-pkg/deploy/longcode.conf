# 智能代码生成平台 —— Nginx 站点配置
# 部署位置：/etc/nginx/conf.d/longcode.conf
# 说明：静态前端 + /api/ 反向代理到 127.0.0.1:8787，SSE 免缓冲

server {
    listen 80;
    listen [::]:80;
    server_name  __DOMAIN__;

    # 略大于后端 10MB 兜底，留余量
    client_max_body_size 12m;

    access_log /var/log/nginx/longcode.access.log;
    error_log  /var/log/nginx/longcode.error.log warn;

    # ---------- 前端静态文件 ----------
    root /var/www/longcode;
    index index.html;

    # HTML 入口禁止缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 第三方库长缓存
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---------- SSE 关键配置 ----------
        proxy_buffering off;              # 禁用缓冲，事件即时下发
        proxy_cache off;                  # 禁用缓存
        proxy_read_timeout 300s;          # SSE 长连接读超时
        proxy_send_timeout 300s;
        proxy_set_header Connection "";   # 清空 Connection 头，保持长连接
        chunked_transfer_encoding on;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
