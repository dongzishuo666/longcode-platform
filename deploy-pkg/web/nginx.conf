server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源长缓存（vendor / 语言包等）
    location ~* \.(js|mjs|css|html?|json|svg|png|woff2?|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 反向代理到后端容器（服务名 backend，由 docker-compose 网络解析）
    # 注意 proxy_pass 末尾【不带】/，保留原始 /api/ 前缀转发给后端
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（/api/chat 流式输出）
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # 单页应用兜底：非 /api 一律回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
